    // --- STREAMING_CHUNK:Hook for audio synthesizer... ---
    function useAudioSynth() {
      const audioCtxRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTrack, setCurrentTrack] = useState(null);

      const playTrack = (track) => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }

        if (isPlaying && currentTrack?.id === track.id) {
          setIsPlaying(false);
          return;
        }

        setCurrentTrack(track);
        setIsPlaying(true);

        const ctx = audioCtxRef.current;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(track.audioFreq || 350, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(2800, now + 0.6);

        gain.gain.setValueAtTime(0.25, now);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 4.5);

        setTimeout(() => {
          setIsPlaying(false);
        }, 4500);
      };

      return { isPlaying, currentTrack, playTrack };
    }

    function App() {

      const [activeNewsModal, setActiveNewsModal] = useState(null);

      const [isAutoplay, setIsAutoplay] = useState(true);
      const [isHovered, setIsHovered] = useState(false);
      const [isTracksHovered, setIsTracksHovered] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      const dragStartX = useRef(null);
      const isDraggingRef = useRef(false);
      const wheelCooldown = useRef(false);

      const { isPlaying, currentTrack, playTrack } = useAudioSynth();

      const handlePrev = useCallback(() => {
        setActiveTrackIndex((prev) => (prev - 1 + TRACKS_DATA.length) % TRACKS_DATA.length);
      }, []);

      const handleNext = useCallback(() => {
        setActiveTrackIndex((prev) => (prev + 1) % TRACKS_DATA.length);
      }, []);

      // Round-robin Infinite Video Carousel Rotation
      const handleVideoPrev = useCallback(() => {
        setActiveVideoIndex((prev) => (prev - 1 + VIDEOS_DATA.length) % VIDEOS_DATA.length);
      }, []);

      const handleVideoNext = useCallback(() => {
        setActiveVideoIndex((prev) => (prev + 1) % VIDEOS_DATA.length);
      }, []);

      // Autoplay timer effect with pause on hover
      useEffect(() => {
        if (!isAutoplay || isHovered) return;
        const interval = setInterval(() => {
          handleVideoNext();
        }, 4000);
        return () => clearInterval(interval);
      }, [isAutoplay, isHovered, handleVideoNext]);

      // Round-robin autoplay for tracks carousel (pauses on hover/touch)
      useEffect(() => {
        if (!isAutoplay || isTracksHovered) return;
        const interval = setInterval(() => {
          handleNext();
        }, 4500);
        return () => clearInterval(interval);
      }, [isAutoplay, isTracksHovered, handleNext]);

      // Keyboard arrow key navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft') {
            handleVideoPrev();
          } else if (e.key === 'ArrowRight') {
            handleVideoNext();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleVideoPrev, handleVideoNext]);


      // Mouse / Touch drag handlers
      const onMouseDown = (e) => {
        dragStartX.current = e.clientX || e.touches?.[0]?.clientX;
        isDraggingRef.current = true;
      };

      const onMouseMove = (e) => {
        if (!isDraggingRef.current || dragStartX.current === null) return;
        const currentX = e.clientX || e.touches?.[0]?.clientX;
        const diffX = currentX - dragStartX.current;

        if (diffX > 45) {
          handlePrev();
          isDraggingRef.current = false;
          dragStartX.current = null;
        } else if (diffX < -45) {
          handleNext();
          isDraggingRef.current = false;
          dragStartX.current = null;
        }
      };

      const onMouseUp = () => {
        isDraggingRef.current = false;
        dragStartX.current = null;
      };

      const onVideoMouseDown = (e) => {
        dragStartX.current = e.clientX || e.touches?.[0]?.clientX;
        isDraggingRef.current = true;
      };

      const onVideoMouseMove = (e) => {
        if (!isDraggingRef.current || dragStartX.current === null) return;
        const currentX = e.clientX || e.touches?.[0]?.clientX;
        const diffX = currentX - dragStartX.current;

        if (diffX > 40) {
          handleVideoPrev();
          isDraggingRef.current = false;
          dragStartX.current = null;
        } else if (diffX < -40) {
          handleVideoNext();
          isDraggingRef.current = false;
          dragStartX.current = null;
        }
      };

      const onVideoMouseUp = () => {
        isDraggingRef.current = false;
        dragStartX.current = null;
      };

        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        return () => {
          lenis.destroy();
        };
      }, []);

        gsap.fromTo('.hero-title-text', 
          { y: 140, opacity: 0, scaleY: 1.4 },
          { y: 0, opacity: 1, scaleY: 1.15, duration: 1.5, ease: 'power4.out', delay: 0.1 }
        );

        gsap.fromTo('.hero-reticle',
          { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 1, delay: 0.8, ease: 'back.out(1.7)' }
        );

        );

    const root = ReactDOM.createRoot(document.getElementById('root'));
